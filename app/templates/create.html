{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto bg-gray-900 p-6 rounded-xl border border-gray-800">
  <h2 class="text-2xl font-bold mb-6 text-white">Add Stalled Project</h2>
  <form action="/projects" method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">Project Title</label>
      <input type="text" name="title" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">Description</label>
      <textarea name="description" rows="3" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">Tech Stack (comma separated)</label>
      <input type="text" name="tech_stack" placeholder="FastAPI, React, SQLite" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">Repository URL (optional)</label>
      <input type="url" name="repo_url" placeholder="https://github.com/..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
    </div>
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition">Submit to Graveyard</button>
  </form>
</div>
{% endblock %}
